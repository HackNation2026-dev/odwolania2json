[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odwolania2json"
description = "Odwołania2JSON — konwerter PDF-ów spraw odwoławczych do ścisłego JSON."
requires-python = ">=3.13"
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
version = {attr = "odwolania2json.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["odwolania2json*"]

[tool.setuptools.package-data]
# Migracje SQL muszą trafić do pakietu pip, inaczej `migrate` nie ma schematu.
odwolania2json = ["db/migrations/*.sql"]
