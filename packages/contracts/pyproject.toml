[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odwolania2json-contracts"
description = "Kontrakt danych Odwołania2JSON — modele pydantic generowane z openapi.yaml."
requires-python = ">=3.11"
dependencies = ["pydantic==2.14.4"]
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {attr = "odwolania2json_contracts.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["odwolania2json_contracts*"]
